name = Mailversendala

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.charset = UTF-8
appender.console.layout.pattern = %d{ISO8601} %-5p %c{1} [%t] %m%n

# A new timestamped protocol file for each application start, relative to the working directory.
appender.file.type = File
appender.file.name = RUN_FILE
appender.file.fileName = mailversendala-${sys:mailversendala.runId:-${date:yyyy-MM-dd_HH-mm-ss-SSS}}.log
# Keep earlier entries if Log4j reconfigures during the same run.
appender.file.append = true
appender.file.immediateFlush = true
appender.file.layout.type = PatternLayout
appender.file.layout.charset = UTF-8
appender.file.layout.pattern = %d{ISO8601} %-5p %c{1} [%t] %m%n

rootLogger.level = info
rootLogger.appenderRef.console.ref = STDOUT
rootLogger.appenderRef.file.ref = RUN_FILE
